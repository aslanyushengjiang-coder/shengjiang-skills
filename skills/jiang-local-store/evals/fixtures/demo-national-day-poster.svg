<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="国庆活动测试海报，可编辑回归夹具">
  <rect id="change-background-base" width="1080" height="1350" fill="#F5EEE4"/>
  <circle id="change-background-decoration-1" cx="930" cy="150" r="240" fill="#D9684D" opacity="0.72"/>
  <path id="change-background-decoration-2" d="M0 1040 C260 900 430 980 590 1350 H0 Z" fill="#A44835" opacity="0.9"/>
  <g id="protected-dish">
    <image href="../../assets/demo/dish-photo.png" x="100" y="610" width="880" height="660" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="protected-logo">
    <rect x="90" y="80" width="360" height="110" rx="18" fill="#7A2F2A"/>
    <text x="270" y="151" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="42" font-weight="700" fill="#F5EEE4">姜小面测试店</text>
  </g>
  <text id="protected-title" x="90" y="300" font-family="PingFang SC, sans-serif" font-size="78" font-weight="800" fill="#7A2F2A">开业测试活动</text>
  <text id="change-date" x="90" y="390" font-family="PingFang SC, sans-serif" font-size="42" fill="#7A2F2A">2026年10月1日—10月7日</text>
  <g id="protected-price">
    <text x="90" y="520" font-family="PingFang SC, sans-serif" font-size="82" font-weight="800" fill="#A44835">￥25</text>
  </g>
  <g id="protected-demo-qr" transform="translate(820 90)">
    <rect width="170" height="170" rx="8" fill="#FFFFFF" stroke="#7A2F2A" stroke-width="6"/>
    <rect x="20" y="20" width="46" height="46" fill="#7A2F2A"/>
    <rect x="104" y="20" width="46" height="46" fill="#7A2F2A"/>
    <rect x="20" y="104" width="46" height="46" fill="#7A2F2A"/>
    <rect x="88" y="88" width="24" height="24" fill="#7A2F2A"/>
    <rect x="120" y="112" width="30" height="30" fill="#7A2F2A"/>
  </g>
  <text x="820" y="285" font-family="PingFang SC, sans-serif" font-size="20" fill="#7A2F2A">DEMO QR｜不可投放</text>
</svg>
