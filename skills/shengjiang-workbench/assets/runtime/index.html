<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>个人 AI 工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">S</span>
          <div>
            <strong id="brandName">个人 AI 工作台</strong>
            <small id="brandOwner">本地工作台</small>
          </div>
        </div>
        <button class="sidebar-new" type="button" data-add-active>＋ 新建</button>
        <nav id="navigation" aria-label="工作台模块"></nav>
        <nav class="utility-navigation" aria-label="工作台工具">
          <button class="nav-item subtle" type="button" data-route="search">
            <span><svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></span><span>全局搜索</span>
          </button>
          <button class="nav-item subtle" type="button" data-route="assistant">
            <span><svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.4 4.6L18 9l-4.6 1.4L12 15l-1.4-4.6L6 9l4.6-1.4z"/><path d="m18 15 .7 2.3L21 18l-2.3.7L18 21l-.7-2.3L15 18l2.3-.7z"/></svg></span><span>AI 助手</span>
          </button>
          <button class="nav-item subtle" type="button" data-route="settings">
            <span><svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A7 7 0 0 0 15 6l-.3-2.6h-4L10.5 6A7 7 0 0 0 9 7.1l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1A7 7 0 0 0 10.5 18l.3 2.6h4L15 18a7 7 0 0 0 1.5-1.1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1z"/></svg></span><span>设置与数据</span>
          </button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <button id="menuButton" class="icon-button menu-button" type="button" aria-label="打开菜单">☰</button>
          <div>
            <p class="eyebrow" id="personaLabel">PERSONAL WORKBENCH</p>
            <h1 id="pageTitle">今日</h1>
          </div>
          <label class="search">
            <span><svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></span>
            <input id="globalSearch" type="search" placeholder="搜索整个工作台" />
          </label>
        </header>

        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>

    <nav id="mobileNavigation" class="mobile-navigation" aria-label="手机端导航"></nav>

    <dialog id="composer">
      <form id="composerForm" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">NEW ITEM</p>
            <h2 id="composerTitle">新增内容</h2>
          </div>
          <button class="icon-button" type="button" data-close-dialog aria-label="关闭">×</button>
        </div>
        <input id="composerModule" type="hidden" />
        <label>
          标题
          <input id="itemTitle" name="title" required maxlength="120" placeholder="写清楚下一步要做什么" />
        </label>
        <label>
          补充说明
          <textarea id="itemNote" name="note" rows="4" maxlength="1000" placeholder="可以留空"></textarea>
        </label>
        <div class="dialog-actions">
          <button class="button secondary" type="button" data-close-dialog>取消</button>
          <button class="button primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <input id="importFile" type="file" accept="application/json,.json" hidden />
    <div id="toast" class="toast" role="status"></div>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
